services:
  postgres:
    image: postgres:17-alpine
    container_name: dma-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: marketing_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
